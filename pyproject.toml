[project]
name = "mcp-bw-modeling-api"
version = "0.1.0"
description = "MCP server exposing SAP BW/4HANA Modeling API resources (InfoAreas, InfoObjects, ADSOs, CompositeProviders, Queries, and more)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
]

[project.scripts]
mcp-bw-modeling-api = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# server.py is a single top-level module (flat layout).
include = ["server.py"]
